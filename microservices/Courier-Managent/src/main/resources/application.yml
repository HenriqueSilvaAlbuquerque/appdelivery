server:
  port: 8081

spring:
  application:
    name: Courier-Management
  datasource:
    url: jdbc:postgresql://localhost:5432/courier_db
    username: postgres
    password: postgres
  kafka:
    consumer:
      bootstrap-servers: localhost:9092
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      group-id: courier-management
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: '*'
        spring.json.type.mapping:
          delivery-placed-event:com.dev.appdelivery.infra.event.DeliveryPlacedIntegrationEvent,
          delivery-picked-up-event:com.fasterxml.jackson.databind.JsonNode,
          delivery-full-filledd-event:com.dev.appdelivery.infra.event.DeliveryFulFilledIntegrationEvent
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false